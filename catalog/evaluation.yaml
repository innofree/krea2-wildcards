schema_version: 1
catalog: evaluation
approval_policy:
  minimum_pilot_seeds: 2
  minimum_approval_seeds: 3
  minimum_prompt_adherence: 4
  minimum_style_fidelity: 3
  minimum_stability: 3
  minimum_compatibility: 3
  maximum_critical_failures: 0
  # Atomic axis items vary a single attribute against an anchor scene that
  # Phase 6 already validated at 3 seeds, so seed variance is dominated by the
  # fixed anchor rather than the item. Complete-scene families control every
  # axis at once and keep the original 5-seed bar.
  complete_scene_approval_seeds: 5
  complete_scene_families:
    - artist_signature
    - editorial_fashion
    - futuristic_neon
    - gothic_luxury
    - graphic_action
    - ink_wash
    - luminous_game
    - refined_pastel
    - retro_cel
    - romantic_ornamental
    - style_pack
    - watercolor_story
score_range: [1, 5]
metrics:
  - prompt_adherence
  - style_fidelity
  - stability
  - character_quality
  - composition_quality
  - compatibility
  - distinctiveness
  - prompt_efficiency
results:
  pilot_v0_1:
    date: '2026-07-26'
    model: krea2_turbo_mxfp8
    workflow: tests/baseline/workflow.json
    seeds: [1001, 2002, 3003]
    resolution: [1024, 1024]
    lora_applied: false
    styles:
      crystal_iris_pastel:
        averages:
          prompt_adherence: 4
          style_fidelity: 4
          stability: 5
          character_quality: 4
          composition_quality: 5
          compatibility: 4
          distinctiveness: 4
          prompt_efficiency: 4
        critical_failures: 0
        recommendation: advance_to_combination_testing
      angular_impact:
        averages:
          prompt_adherence: 3
          style_fidelity: 4
          stability: 5
          character_quality: 4
          composition_quality: 4
          compatibility: 2
          distinctiveness: 5
          prompt_efficiency: 4
        critical_failures: 0
        recommendation: retest_with_graphic_action_template
      prismatic_key_visual:
        averages:
          prompt_adherence: 3
          style_fidelity: 4
          stability: 5
          character_quality: 5
          composition_quality: 5
          compatibility: 3
          distinctiveness: 4
          prompt_efficiency: 4
        critical_failures: 0
        recommendation: retest_with_luminous_game_template
      sumi_mist:
        averages:
          prompt_adherence: 5
          style_fidelity: 5
          stability: 5
          character_quality: 4
          composition_quality: 5
          compatibility: 4
          distinctiveness: 5
          prompt_efficiency: 5
        critical_failures: 0
        recommendation: advance_to_combination_testing
      minimal_studio:
        averages:
          prompt_adherence: 3
          style_fidelity: 4
          stability: 4
          character_quality: 3
          composition_quality: 1.3
          compatibility: 2
          distinctiveness: 4
          prompt_efficiency: 4
        critical_failures: 3
        recommendation: retest_with_full_length_editorial_template
    conclusion: >-
      Remote wildcard expansion and model response are verified. A single neutral template is
      suitable for atomic attributes but conflicts with complete packs that intentionally control
      pose, environment, or framing; family-compatible templates are required before approval.
  family_retest_v0_2:
    date: '2026-07-26'
    model: krea2_turbo_mxfp8
    workflow: tests/baseline/workflow.json
    report: tests/reports/family_retest_v0_2/review.md
    summary: tests/reports/family_retest_v0_2/approval_summary.json
    seeds: [1001, 2002, 3003, 4004, 5005]
    resolution: [1024, 1024]
    lora_applied: false
    styles:
      crystal_iris_pastel:
        averages: {prompt_adherence: 4, style_fidelity: 5, stability: 5, character_quality: 5, composition_quality: 5, compatibility: 5, distinctiveness: 4, prompt_efficiency: 5}
        critical_failures: 0
        recommendation: approved
      angular_impact:
        averages: {prompt_adherence: 5, style_fidelity: 5, stability: 5, character_quality: 4, composition_quality: 5, compatibility: 5, distinctiveness: 5, prompt_efficiency: 5}
        critical_failures: 0
        recommendation: approved
      prismatic_key_visual:
        averages: {prompt_adherence: 4, style_fidelity: 5, stability: 5, character_quality: 5, composition_quality: 5, compatibility: 5, distinctiveness: 5, prompt_efficiency: 5}
        critical_failures: 0
        recommendation: approved_with_tight_framing_note
      sumi_mist:
        averages: {prompt_adherence: 4, style_fidelity: 5, stability: 5, character_quality: 4, composition_quality: 5, compatibility: 5, distinctiveness: 5, prompt_efficiency: 5}
        critical_failures: 0
        recommendation: approved
      minimal_studio:
        averages: {prompt_adherence: 4.8, style_fidelity: 5, stability: 5, character_quality: 5, composition_quality: 5, compatibility: 5, distinctiveness: 4, prompt_efficiency: 5}
        critical_failures: 0
        recommendation: approved
    conclusion: >-
      Family-compatible templates resolved the generic-scene conflicts. All five styles completed
      five distinct seeds without critical failures and met the approval thresholds. The luminous
      game result consistently preferred a tighter hero frame, which remains documented as a
      non-blocking limitation.
  style_screen_v0_3:
    date: '2026-07-26'
    model: krea2_turbo_mxfp8
    workflow: tests/baseline/workflow.json
    scorecard: tests/reports/style_screen_v0_3/scored.csv
    summary: tests/reports/style_screen_v0_3/summary.json
