    review_manifest: tests/reports/style_screen_v0_3/review/manifest.json
    seeds: [1001, 2002, 3003]
    resolution: [1024, 1024]
    lora_applied: false
    image_count: 135
    style_count: 45
    status_counts: {testing: 16, rejected: 29, approved: 0}
    conclusion: >-
      Fixed-seed screening confirmed high image and seed stability but found that family templates
      dominated many individual style prompts. Sixteen styles met the pilot quality gates and move
      to two additional approval seeds. Twenty-nine styles remain out of runtime production and
      require stronger visual-property wording before a new three-seed screen.
  style_retest_v0_4:
    date: '2026-07-26'
    model: krea2_turbo_mxfp8
