      - effect_element_ember_points
      - placement_lower_frame
      - density_gradual_build
      - motion_gentle_fall
    feature_axes:
      effect_element:
        - ember_points
      placement:
        - lower_frame
      density:
        - gradual_build
      motion:
        - gentle_fall
    prompt: >-
      Add sparse ember-like points with warm cores and quickly fading halos, concentrated near the lower
      frame with open space around the torso and face. Use density that builds gradually from a clear
      foreground toward a richer distant layer, with the elements descending gently with varied spacing
      and no dense overlap across the subject. Keep the adult subject fully readable with realistic skin
      texture, coherent hands, believable fabric, natural proportions, cinematic depth, controlled highlights,
      and no text, logos, or watermarks.
    compatibility:
      avoid: []
    source_refs:
      - internal_taxonomy_v1
      - benchmark_observation
      - cie_international_lighting_vocabulary
    runtime:
      file: krea2/style/effects.yaml
