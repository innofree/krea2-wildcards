        - faceted_rhythmic
      color_strategy:
        - warm_cool_split
      surface_character:
        - chalk_matte
      atmosphere:
        - ceremonial_energy
      edge_language:
        - crisp_cut
    prompt: >-
      An adult visual treatment combines faceted planes repeated in a controlled rhythm with sharp focal
      transitions, a clear warm-cool division that guides attention without breaking material believability,
      a matte chalklike surface with fine grain and softly absorbed highlights, buoyant ceremonial energy
      conveyed through upward rhythms and luminous accents, and crisp cut edges with small controlled
      breaks. Preserve realistic skin texture, coherent hands, believable fabric, natural proportions,
      cinematic depth, and a frame free of text, logos, and watermarks.
    compatibility:
      avoid: []
    source_refs:
      - internal_taxonomy_v1
      - anima_official_model_card
      - getty_aat_costume_vocabulary
      - cie_international_lighting_vocabulary
