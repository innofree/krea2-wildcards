      highlights, while buoyant ceremonial energy conveyed through upward rhythms and luminous accents
      defines the final mood. Preserve realistic skin texture, coherent hands, believable fabric, natural
      proportions, cinematic depth, and a frame free of text, logos, and watermarks.
