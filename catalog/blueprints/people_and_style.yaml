        Build obvious diagonal planes around the figure; coat backdrop in visible dry chalk dust; drop the set into deep black evening; focus face and hands while the set perimeter blurs.
      style_pack_expansion_faceted_rhythmic_warm_cool_split_chalk_matte_nocturnal_tension_soft_bleed_complete_style: >-
        Build obvious diagonal planes around the figure; coat backdrop in visible dry chalk dust; drop the set into deep black evening; cast a wide colored halo beyond the silhouette.
