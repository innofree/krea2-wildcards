  - id: media_rendering
    kind: media_rendering
    output_file: media_rendering.yaml
    family: media_rendering
    runtime:
      file: krea2/style/rendering.yaml
      path_prefix: [krea2, style, rendering]
    source_refs:
      - internal_taxonomy_v1
      - getty_aat_costume_vocabulary
      - cie_international_lighting_vocabulary
    target_count: 150
    dimensions:
      - id: mark_making
        values:
          - id: transparent_washes
            text: overlapping transparent washes with controlled blooms and preserved light areas
          - id: dry_brush
            text: directional dry-brush marks that reveal the ground and gather around focal edges
          - id: dense_stipple
            text: dense stippled marks that accumulate into smooth tonal fields from a normal viewing distance
          - id: opaque_layers
            text: flat opaque layers with carefully cut boundaries and selective soft transitions
          - id: fluid_ink
            text: fluid ink-like passages with tapered pools, narrow runs, and deliberate untouched space
          - id: granular_graphite
            text: granular graphite-like strokes with compressed darks and softly rubbed midtones
          - id: carved_block
            text: carved blocklike marks with firm directional cuts and small irregular edge breaks
          - id: polished_airbrush
            text: polished airbrush gradients held in check by crisp focal accents and clear silhouettes
      - id: surface_behavior
        values:
          - id: fibrous_tooth
            text: a fibrous surface tooth that catches pigment unevenly without obscuring facial detail
          - id: smooth_coated
            text: smooth coated stock that supports sharp edges and clean, uninterrupted gradients
          - id: cold_pressed_grain
            text: cold-pressed grain with shallow dimples that remain visible through transparent passages
          - id: satin_film
            text: a thin satin pigment film with restrained sheen and even color density
          - id: translucent_vellum
            text: a translucent vellum-like layer that reveals softly offset marks beneath the surface
          - id: rough_mineral_ground
            text: a rough mineral ground with scattered tooth and naturally varied mark absorption
      - id: depth_treatment
        values:
          - id: layered_overlays
            text: shallow layered overlays separated by edge clarity and controlled transparency
          - id: atmospheric_recession
            text: atmospheric recession built through cooling color, lower contrast, and softened distant edges
          - id: sculpted_midtones
            text: sculpted midtone volume with compact shadows and broad connected highlights
          - id: poster_separation
            text: strong poster-like depth separation using a few deliberate value bands
          - id: glaze_buildup
            text: luminous glaze buildup that deepens color while preserving light through the layers
      - id: light_response
        values:
          - id: velvety_diffuse
            text: velvety diffuse highlights that turn gradually across skin and fabric
          - id: pearlescent_soft
            text: pearlescent soft highlights with subtle hue shifts and no harsh clipping
          - id: crisp_edge
            text: crisp edge highlights reserved for the face, hands, and important garment folds
          - id: absorbed_low_sheen
            text: absorbed low-sheen light with deep but readable shadow color
    templates:
      - id: complete_media
        text: >-
          An adult subject uses {mark_making} on {surface_behavior}, with {depth_treatment} and
          {light_response}. Preserve realistic skin texture, coherent hands, believable fabric,
          natural proportions, cinematic depth, and no text, logos, or watermarks.
    compatibility:
      avoid: []

