schema_version: 1
collections:
  - id: artist_signature
    kind: artist_signature
    output_file: artists.yaml
    family: artist_signature
    runtime:
      file: krea2/artist_signature/modern.yaml
      path_prefix: [krea2, artist_signature, modern]
    source_refs:
      - internal_taxonomy_v1
      - novelai_official_tagging
      - anima_official_model_card
      - cie_international_lighting_vocabulary
    target_count: 300
    dimensions:
      - id: line_language
        values:
          - id: lace_tapered
            text: lace-fine tapered lines with sparse inner marks
          - id: crisp_measured
            text: crisp narrow lines with measured corners
          - id: supple_ribbon
            text: supple ribbon lines with focal swells
          - id: dry_broken
            text: dry broken lines with confident accents
          - id: rounded_continuous
            text: rounded linework with reinforced features
          - id: angular_architectural
            text: angular architectural lines with even spacing
      - id: face_design
        values:
          - id: compact_oval
            text: a compact oval face with a soft jaw and small nose
          - id: tapered_high
            text: a tapered face with high cheekbones
          - id: rounded_soft
            text: a rounded face with full cheeks and short nose
          - id: angular_planar
            text: an angular face with a firm jaw and planar cheeks
      - id: eye_design
        values:
          - id: layered_large
            text: large layered irises, tapered lashes, and paired catchlights
          - id: narrow_focused
            text: narrow dark-rimmed eyes and single catchlights
          - id: rounded_radial
            text: rounded eyes, radial irises, and soft lower gradients
          - id: almond_deep
            text: deep-set almond eyes, light lashes, and small catchlights
      - id: body_design
        values:
          - id: balanced_narrow
            text: a balanced figure with narrow shoulders and precise hands
          - id: compact_grounded
            text: a grounded figure with sturdy limbs and clear hands
          - id: elongated_graceful
            text: an elongated figure with graceful limbs and tapered hands
          - id: broad_athletic
            text: an athletic figure with stable joints and firm hands
      - id: palette_language
        values:
          - id: mineral_pastel
            text: pale mineral blue, ivory, coral, and charcoal
          - id: deep_jewel
            text: deep garnet, ink blue, forest, and restrained gold
          - id: sunlit_earth
            text: sunlit terracotta, sand, olive, cream, and brown
          - id: nocturnal_neon
            text: nocturnal indigo, cool cyan, and measured magenta
          - id: monochrome_tint
            text: near-monochrome color, a quiet tint, and a pale accent
      - id: light_modeling
        values:
          - id: soft_two_step
            text: soft two-step values and gentle facial transitions
          - id: broad_painterly
            text: broad blended value planes and rounded volume
          - id: luminous_glaze
            text: translucent glaze, reflected color, and open penumbrae
          - id: crisp_graphic
            text: hard-edged two-value cel blocks
          - id: velvety_diffuse
            text: velvety diffuse values and soft contact shadows
      - id: framing_language
        values:
          - id: centered_emblematic
            text: centered emblematic framing with face-to-hands hierarchy
          - id: spacious_asymmetric
            text: spacious asymmetric framing and quiet directional flow
          - id: layered_intimate
            text: layered intimate framing and a close foreground accent
          - id: vertical_heroic
            text: a strong vertical frame with a low visual anchor
      - id: ornament_language
        values:
          - id: floral_trace
            text: sparse floral traces and quiet border motifs
          - id: geometric_inset
            text: precise geometric insets and corner accents
          - id: particle_drift
            text: drifting particles away from facial features
          - id: textile_echo
            text: restrained textile patterns around the silhouette
    templates:
      - id: complete_signature
        text: >-
          An adult portrait uses {line_language}, {face_design}, {eye_design}, {body_design},
          {palette_language}, {light_modeling}, {framing_language}, and {ornament_language}.
          Preserve realistic skin texture, coherent hands, believable fabric, natural proportions,
          cinematic depth, and no text, logos, or watermarks.
    compatibility:
      avoid: [hard_photorealism]

  - id: style_pack_expansion
    kind: style_pack
    output_file: style_expansion.yaml
    family: style_pack
    runtime:
      file: krea2/style/complete_pack.yaml
      path_prefix: [krea2, style, complete_pack]
    source_refs:
      - internal_taxonomy_v1
      - anima_official_model_card
      - getty_aat_costume_vocabulary
      - cie_international_lighting_vocabulary
    target_count: 150
    dimensions:
      - id: shape_language
        values:
          - id: geometric_slender
            text: long vertical set divisions, narrow rectangular shadows, and clean upright edges
          - id: organic_flowing
            text: broad curved light paths, flowing shadows, and repeated organic shapes
          - id: ornamental_layered
            text: layered border motifs and repeated decorative shapes framing the subject
          - id: minimal_quiet
            text: broad clean negative space with only two or three decisive set shapes
          - id: faceted_rhythmic
            text: angular shadow planes and repeated diagonal divisions around the subject
          - id: rounded_graphic
            text: large circular light pools, rounded shadows, and bold silhouette spacing
      - id: color_strategy
        values:
          - id: low_contrast_pastel
            text: pale blush, powder blue, warm ivory, and small charcoal anchors
          - id: jewel_and_gold
            text: garnet, sapphire, and emerald fields with restrained gold highlights
          - id: warm_cool_split
            text: an amber-lit side and blue-shadowed side across subject and backdrop
          - id: mineral_muted
            text: muted slate, clay, sage, and limestone with small pale highlights
          - id: limited_duotone
            text: exactly two dominant colors across clothing, light, shadow, and backdrop
      - id: surface_character
        values:
          - id: chalk_matte
            text: powdery matte grain across midtones and backdrop with absorbed highlights
          - id: satin_clean
            text: smooth tonal transitions and controlled satin sheen on lit surfaces
          - id: fibrous_paper
            text: fine paper fibers in backdrop and shadows while skin and fabric stay clear
          - id: glazed_luminous
            text: translucent color layers, luminous reflections, and crisp bright accents
          - id: weathered_ink
            text: weathered dark marks, broken texture, and offset color at outer edges
      - id: atmosphere
        values:
          - id: contemplative_air
            text: calm open spacing, low visual noise, and thin suspended haze
          - id: ceremonial_energy
            text: upward beams, rising forms, and restrained ceremonial glints
          - id: nocturnal_tension
            text: deep evening values, narrow light paths, and tense still space
      - id: edge_language
        values:
          - id: selective_taper
            text: sharp facial and hand edges tapering into soft peripheral boundaries
          - id: lost_and_found
            text: silhouette sections merging into the backdrop while focal edges stay firm
          - id: crisp_cut
            text: hard separated silhouette and shadow edges with few controlled breaks
          - id: soft_bleed
            text: soft color bloom and halation outside a readable silhouette
          - id: etched_accent
            text: razor-thin highlights and fine contrast around the face and hands
    templates:
      - id: complete_style
        text: >-
          Photorealistic adult editorial treatment: {shape_language}. Use {color_strategy},
          {surface_character}, {atmosphere}, and {edge_language}.
    prompt_overrides:
      style_pack_expansion_faceted_rhythmic_warm_cool_split_chalk_matte_nocturnal_tension_crisp_cut_complete_style: >-
        Build obvious diagonal planes around the figure; coat backdrop in visible dry chalk dust; drop the set into deep black evening; give shadows hard knife-cut boundaries.
      style_pack_expansion_faceted_rhythmic_warm_cool_split_chalk_matte_nocturnal_tension_etched_accent_complete_style: >-
        Build obvious diagonal planes around the figure; coat backdrop in visible dry chalk dust; drop the set into deep black evening; rim-light face and both hands with thin white lines.
