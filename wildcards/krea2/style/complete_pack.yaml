krea2:
  style:
    complete_pack:
      crystal_iris_pastel:
        - >-
          Refined character artwork with thin tapered contours, compact facial proportions, large crystal-clear
          irises built from layered gradients, soft two-step cel shading, restrained pastel colors, and
          generous luminous negative space
      porcelain_sky:
        - >-
          Polished character key visual with precise hairline contours, porcelain-smooth facial color
          transitions, glass-like eyes with pale lower-iris light, cool sky-blue accents, restrained cel
          shadows, and a balanced uncluttered frame
      quiet_blossom:
        - >-
          Quiet intimate character study with restrained tapered lines, softly pointed facial structure,
          luminous eyes under fine upper lashes, cream and dusty-rose local colors, minimal facial shadow,
          and sparse blossom accents near the close framing
      angular_impact:
        - >-
          Forceful character artwork with bold contour hierarchy, sharp angular interior marks, crisp
          hard-edged cel shadows, a concentrated red-blue-yellow palette, enlarged action shapes, and
          a steep diagonal composition charged with forward momentum
      crimson_speed:
        - >-
          High-energy character key visual with thick outer contours against fine interior details, hard
          directional cel lighting, deep crimson and charcoal color blocks, bright white impact accents,
          and a tightly cropped pose breaking across the frame
      electric_foreshortening:
        - >-
          Dynamic character artwork with confident angular contours, a geometric face and intense gaze,
          saturated cyan-orange light separation, crisp graphic shadows, controlled sparks, and dramatic
          foreshortening that pushes one limb toward the viewer
      prismatic_key_visual:
        - >-
          Premium fantasy character key visual with precise controlled contours, elegant facial proportions,
          jewel-like eyes with radial iris detail, layered cel and gradient modelling, prismatic rim light,
          and a heroic centered composition with restrained particles
      jewel_tone_hero:
        - >-
          Noble character showcase with clean narrow linework, a calm sculpted face, faceted irises, rich
          sapphire and garnet color separation, softly modelled fabric and armor surfaces, and a spacious
          low-angle composition under controlled rim lighting
      ethereal_splash:
        - >-
          Ethereal character splash artwork with filigree-fine contours, serene compact features, luminous
          layered eyes, spectral turquoise-violet color transitions, translucent fabric edges, and floating
          foreground shapes creating deep ceremonial space
      floral_cameo:
        - >-
          Graceful profile artwork with long curved contours, a delicate nose and softly pointed chin,
          gem-bright eyes, cream and rose local colors, gentle gradient shading, and a botanical border
          whose stems echo the direction of the hair
      sumi_mist:
        - >-
          Contemplative ink-and-wash character artwork with fluid black brush contours, spare facial marks,
          dark lucid eyes, pale diluted grey washes, visible absorbent paper grain, mist-softened edges,
          and broad breathing negative space
      cathedral_velvet:
        - >-
          Gothic luxury portrait with ornate controlled contours, aristocratic angular features, deep
          reflective eyes, black velvet and oxblood color fields, narrow candlelit highlights, and symmetrical
          cathedral arches rising behind the figure
      black_lace_candle:
        - >-
          Intimate gothic character study with black-lace line detail, a pale elongated adult face, lowered
          dark eyes, ivory skin against matte black fabric, soft candle gradients, and an asymmetrical
          cluster of flames balanced by deep shadow
      silver_nocturne:
        - >-
          Nocturne character artwork with fine silver-edged contours, sharp composed facial planes, moonlit
          grey eyes, blue-black fabric and muted metal accents, cool directional rim light, and a tall
          vertical composition surrounded by pointed architectural shapes
      crimson_baroque:
        - >-
          Baroque character showcase with disciplined scrolling contours, sculpted mature features, garnet-dark
          eyes, saturated crimson and aged-gold surfaces, dramatic side lighting, and layered drapery
          creating theatrical depth around a clear central silhouette
      holographic_city:
        - >-
          Futuristic character key visual with precise geometric contours, sleek mature facial planes,
          luminous cyan irises, holographic magenta-green reflections, crisp material separation, and
          layered city lights receding through atmospheric depth
      cyan_magenta_noir:
        - >-
          Neon-noir character portrait with sharp economical contours, angular adult features, narrow
          watchful eyes, cyan and magenta split lighting against deep charcoal, wet reflective surfaces,
          and a tight off-center crop with strong shadow geometry
      orbital_signal:
        - >-
          Orbital character showcase with disciplined technical linework, composed mature proportions,
          ring-shaped iris highlights, restrained cobalt and amber emissive accents, matte engineered
          surfaces, and concentric structural arcs framing the centered figure
      minimal_studio:
        - >-
          Minimal fashion editorial with clean precise garment edges, mature natural facial structure,
          restrained eye detail, ivory-charcoal color blocking, soft directional studio light, believable
          fabric weight, and generous negative space around a full-length silhouette
      architectural_couture:
        - >-
          Architectural fashion image with sharply structured garment edges, sculpted adult facial planes,
          a focused direct gaze, limestone and black color harmony, hard raking light, and an elongated
          figure aligned with monumental geometric walls
      monochrome_magazine:
        - >-
          Monochrome fashion portrait with crisp silhouette edges, angular mature facial structure, direct
          understated eyes, smooth grayscale tonal separation, controlled hard-soft lighting, and a bold
          asymmetrical composition without text or branding
