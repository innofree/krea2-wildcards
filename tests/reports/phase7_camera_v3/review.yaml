      agreeing on a modest rightward offset, with the third landing a similar small distance to the left
      of center — normal seed-to-seed compositional variance, not a dramatic direction reversal. None
      of the three renders show a strong, textbook rule-of-thirds placement (~33%/67%), but none look
      broken or inconsistent either; all read as clean, well-executed, professionally composed headshots.
      The original "too noisy to confirm" assessment reflected the limits of judging fine compositional
      placement from a small contact-sheet thumbnail, not an actual flaw visible in the full-resolution
