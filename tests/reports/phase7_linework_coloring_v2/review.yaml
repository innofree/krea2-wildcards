      58%). The accepted sibling P7000271 shows the same incoherent purple/navy noise (R=0.67). A test
      whose evidence appears identically in a passing sibling cannot distinguish this item. The prompt
      also specifies deep jewel "separated by dark neutrals," so dark neutral mass is within spec.


