      [pass] case_005: angular_precise + deep_jewel confirmed (hard straight-cut lapel facets; forest-green/plum-maroon/navy
      at hue 213-262, v~0.12), but fine_tonal_hatching unreadable — face and neck are smooth gradients
      at 5x and the jewel-dark jacket hides any hatch strokes. -- overturned at full resolution: Thumbnail
      artifact — the hold does not survive full-resolution inspection.


      RESOLUTION

      case_005 is manifest sheet 005 (`review/manifest.json` -> sheets[4].case_aliases[0]), style_id `linework_coloring_angular_precise_deep_jewel_fine_tonal_hatching_controlled_rim_complete_line_color`,
      scorecard.csv rows 14-16: test_ids P7000013 (seed 1001), P7000014 (seed 2002), P7000015 (seed 3003).
      All three 1024x1024 renders inspected at 1:1 and at 3x-8x NEAREST crops, plus an unsharp/high-pass
      pass to expose low-contrast stroke texture in the dark garment.


      WHAT FULL RES SHOWS

      - angular_precise + deep_jewel: re-confirmed. Hard straight-cut lapel facets and crisp angular plane
      boundaries; plum-maroon / forest-green / near-black-navy garment at very low value.

      - fine_tonal_hatching: READABLE in seed 2002 (P7000014). The navy left-shoulder/upper-chest jacket
      panel carries regular, evenly-spaced fine parallel diagonal hatch strokes — consistent angle, ~3-5
      px pitch, textbook fine tonal hatching. They are visible at 1:1 in the un-enhanced render and unmistakable
      at 3x with no contrast boost at all. That is exactly the region the reviewer wrote off as "the jewel-dark
      jacket hides any hatch strokes": the strokes are 1-2 px wide sitting in a low-contrast dark field,
      so they are destroyed by the ~5x contact-sheet downscale. That is a resolution artifact, not a missing
      trait.


      SEED DISAGREEMENT, AND WHY IT IS NOT THE DEFECT

      Seeds 1001 and 3003 show no discrete hatch strokes — skin and garment shade as finely stepped tonal
      planes and smooth gradients (confirmed on 8x cheek/nose and neck crops and on the whole-image high-pass,
      which surfaces only plane-boundary edges and broad brush streaks). But this is the token's normal
      expression, not an item-level failure: the sibling item case_006 (`..._fine_tonal_hatching_reflected_color_...`,
      P7000016-18) is equally subtle across all three of its seeds. This is the same reasoning the brief
      attaches to airy_pastel saturation — a trait that renders faintly by design is only evidence of
      a defect when it falls below its own class's norm. case_005 sits at or above that norm; it is in
      fact the item that does produce visibly hatched strokes in a seed. Against the broad_blended_plane
      sibling case_001 (P7000001) at matched seed 1001, case_005's skin also reads as finer, subtler tonal
      stepping versus case_001's blockier broad plane facets, so distinctiveness on the shading factor
      is intact.


      SATURATION SCREEN (checked for completeness; colour was never the concern)

      tests/reports/phase7_linework_coloring_v2/saturation_screen.json: deep_jewel group median 0.1628,
      min 0.1107, max 0.2117 across 43 items, outlier_count 0; outlier_total 0 across all 300 items at
      deviation 0.5. No colour evidence against this item.


      Verdict: the trait the reviewer could not read at thumbnail scale is present and legible at full
      resolution. holds=false.


