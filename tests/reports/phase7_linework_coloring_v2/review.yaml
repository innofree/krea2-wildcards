      of deep_jewel + reflected_color in this rig, not an item defect, which is exactly the case the screening
      rule excludes. The official saturation_screen.json (group_axis=coloring, deviation=0.5) reports
      outlier_total=0 and outlier_count=0 for deep_jewel; group median 0.1628, min 0.1107. My own recomputation
