      4/43. Isolating the real confound, the low tail of deep_jewel is almost entirely reflected_color
      (controlled_rim siblings run ~2x brighter: garment value ~92 vs ~34). Within the deep_jewel+reflected_color
      sub-cohort (n=21) the target's garment-region saturation is 0.1458 vs cohort median 0.1607 and chroma
      4.32 vs median 5.53 — rank 6/21, with three accepted siblings lower. Accepted sibling P7000271 (broken_dry
      + deep_jewel + crisp_shape_shadow + reflected_color) renders essentially identically: flat neutral
      black garment, garment chroma 2.38 vs the target's 2.26.


