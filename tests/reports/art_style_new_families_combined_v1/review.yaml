schema_version: 1
review_method: family_contact_sheet_screen
notes: 10 new items (art_deco 5, mid_century_modern 5) reviewed across 2 family contact
  sheets at 3 seeds per item, plus full-resolution spot checks on gilded_sunburst_deco,
  chevron_geometric_deco, and two mid_century_modern items.
styles:
  gilded_sunburst_deco:
    metrics:
      prompt_adherence: 5
      style_fidelity: 5
      stability: 5
      character_quality: 4
      composition_quality: 4
      compatibility: 4
      distinctiveness: 4
      prompt_efficiency: 4
    critical_failure: false
    notes: 'Radiating gilded sunburst beading converging at the waist, marble lobby,
      warm lamp light; stable across all 3 seeds.'
  chevron_geometric_deco:
    metrics:
      prompt_adherence: 5
      style_fidelity: 5
      stability: 5
      character_quality: 4
      composition_quality: 4
      compatibility: 4
      distinctiveness: 4
      prompt_efficiency: 4
    critical_failure: false
    notes: 'Clear angular chevron/zigzag beading pattern at full resolution, distinct
      from the other four art_deco items; stable across all 3 seeds.'
