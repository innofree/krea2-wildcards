schema_version: 1
kind: artist_abc_signature_map
artists:
  artist_001:
    signature_prompt: >-
      Use Soft photographic edges replace drawn outlines, with crisp detail around the face and clothing;
      Natural adult facial proportions and restrained skin detail create a realistic portrait; Small realistically
      proportioned eyes carry subtle catchlights and minimal emphasis; Natural adult proportions form
      a straight, relaxed full-body stance; Warm gray clothing, neutral beige surroundings, and natural
      skin tones keep the palette subdued; Large diffuse studio lighting gives gentle facial modeling
      and a soft floor shadow; The figure is centered at eye level in a plain, full-body vertical portrait;
      The clothing and background are unadorned, with no recurring decorative motif.
  artist_006:
    signature_prompt: >-
      Use Soft lightly textured contours define rounded, simplified forms without sharp graphic edges;
      A rounded simplified face uses gentle features and a mild friendly expression; Small dark eyes are
      simply drawn with little internal detail; The adult figure is simplified into straight limbs and
      an even upright silhouette; Warm gray clothing and a beige-gray ground create a soft, muted range;
      Broad flat tones blend into faint painterly gradients and a soft floor shadow; The full figure remains
      centered at eye level against an empty studio-like ground; There are no recurring accessories or
      decorative motifs.
  artist_030:
    signature_prompt: >-
      Use Smooth monochrome photographic edges define the figure without visible drawn contours; Natural
      adult facial proportions are modeled with restrained grayscale detail; Realistically small eyes
      receive subtle tonal definition rather than graphic emphasis; Natural adult proportions form a quiet,
      upright full-body pose; A consistent neutral grayscale range covers the figure, clothing, and studio
      background; Soft directional studio light creates gentle grayscale modeling and a faint floor shadow;
      The centered figure is shown at eye level in a plain full-body vertical frame; The monochrome clothing
      and background contain no decorative motif.
  artist_091:
    signature_prompt: >-
      Use Fine dark contours and smooth tapered edges produce a polished anime rendering; A small youthful
      face has a tapered chin, tiny nose, and compact mouth; Large glossy amber eyes dominate the face
      with dark lashes and bright highlights; A slender stylized figure uses long legs, a narrow waist,
      and softened anatomy; Dusty pink, charcoal gray, warm beige, and a saturated red accent form the
      palette; Soft cel-like gradients model the body while a diffuse cast shadow anchors the feet; The
      character is centered in an eye-level full-body portrait on a plain vertical ground; A large red
      hair bow is the one prominent decorative accent and repeats in every image.
  artist_116:
    signature_prompt: >-
      Use Smooth realistic silhouettes use no visible drawn contour; Polished oval face has gentle cheeks
      and a softly defined jaw; Natural dark almond eyes have clear but restrained highlights; Average
      slender adult proportions remain evenly balanced; Warm gray and taupe dominate a quiet neutral palette;
      Broad studio light models skin and cloth with soft gradients; Eye-level full-body framing stays
      centered against empty space; Decorative motifs and environmental detail are absent.
  artist_117:
    signature_prompt: >-
      Use Natural photographic edges stay soft and unobtrusive; Mature oval facial structures vary substantially
      between seeds; Small natural eyes remain low contrast and realistically spaced; Realistic adult
      build is shown in both frontal and angled stances; Gray clothing and beige ground maintain muted
      warmth; Soft side lighting gives moderate facial and garment depth; Full-length studio framing remains
      central despite pose shifts; No decorative styling or background objects appear.
  artist_141:
    signature_prompt: >-
      Use Clean dark contours remain even with slight tapering at joints; Compact oval face has simplified
      cheeks and a small pointed chin; Large dark eyes use restrained highlights and gentle expressions;
      Slim adult proportions have long legs and narrow shoulders; Warm charcoal and taupe remain low saturation;
      Flat cel shading is softened by a faint studio gradient; Centered full-length arrangement repeats
      across all seeds; No decorative pattern, accessory, or scenic element appears.
  artist_163:
    signature_prompt: >-
      Use Smooth dark contours are clean with limited weight variation; Broad rounded face has a tiny
      nose, small mouth, and soft cheeks; Very large glossy blue-gray eyes dominate the design; Curvy
      idealized adult proportions use long legs and a large head; Muted charcoal gray and warm brown remain
      tightly controlled; Soft cel gradients provide rounded volume and mild floor shadows; Full figure
      remains centered while pose angle varies; No decorative motif appears beyond simple facial color
      accents.
